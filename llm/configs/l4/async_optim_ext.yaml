# SPEC E5 §11.2 — L4 Optional Extension (AdamW & RMSProp, requires separate user approval)
phase: l4_ext
requires_user_approval: true
model: Qwen/Qwen3-0.6B
enable_thinking: false
master_weights_dtype: fp32
compute_dtype: bf16
gradient_checkpointing: true
micro_batch_size: 4
steps: 150
eval_every: 50
conditions:
  - {k: 0, c: inf}
  - {k: 8, c: 1.2}
  - {k: 8, c: inf}
optimizers:
  adamw:
    betas: [0.9, 0.999]
    lr_grid: [3.0e-7, 1.0e-6, 3.0e-6]
  rmsprop_via_adamw:
    betas: [0.0, 0.999]
    lr_grid: [3.0e-7, 1.0e-6, 3.0e-6]
output_dir: results/e5/l4
