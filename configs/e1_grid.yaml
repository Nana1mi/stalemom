name: e1_grid
problem:
  K: 10
  n_good: 2
  lam: 1.0
  init: random
  init_seed: 0
  init_scale: 1.0
  ref: init
run:
  R: 20
  seed: 12345
  T: 512
  B: 32
  log_every: 1
  diag_every: 8
  return_traj: false
sweep:
  estimator: [is, tis]
  k: [0, 2, 8, 16]
  eta_lam: [0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0]
  momentum:
    - {rho_lam: 0.0}
    - {rho_lam: 0.05}
    - {rho_lam: 0.1}
    - {rho_lam: 0.25}
    - {beta_fixed: 0.6}
    - {beta_fixed: 0.9}
    - {beta_fixed: 0.99}
    - {beta_fixed: 0.999999}
  c: [1.2, 1.5, 2.0]
  mismatch: [lag]
